<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <title>AI Assistant by zmzakay</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app-container">

    <header class="app-header">
        <div class="header-left">
            <div class="header-title">
                <span class="ai-icon">✨</span>
                <h1>Assistant</h1>
            </div>

            <span class="credits-badge">by zmzakay</span>
        </div>

        <button id="newChatBtn" title="New Chat">+</button>
    </header>


    <div id="chatMessages" class="chat-messages">

        <div class="message ai-message">
            <div class="avatar">AI</div>

            <div class="message-bubble">
                Hello! I'm ready. Loading the AI model...
            </div>
        </div>

    </div>


    <div class="input-container">

        <div class="input-box-wrapper">

            <textarea
                id="userInput"
                placeholder="Message AI..."
                rows="1"
            ></textarea>

            <button id="sendBtn" aria-label="Send">

                <svg
                    width="18"
                    height="18"
                    viewBox="0 0 24 24"
                    fill="none"
                    stroke="currentColor"
                    stroke-width="2.5"
                    stroke-linecap="round"
                    stroke-linejoin="round"
                >
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>

            </button>

        </div>

        <div class="footer-note">
            AI can make mistakes. Built by zmzakay.
        </div>

    </div>

</div>


<!-- IMPORTANT: This is JavaScript, not TypeScript -->
<script type="module" src="app.js"></script>

</body>
</html>
